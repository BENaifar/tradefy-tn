<svg role="img" [attr.aria-label]="label" [attr.viewBox]="'0 0 ' + width + ' ' + height" [attr.height]="height" preserveAspectRatio="none">
  <polyline *ngIf="points" [attr.points]="points" />
  <line *ngIf="!points" x1="0" [attr.y1]="height / 2" [attr.x2]="width" [attr.y2]="height / 2" class="flat" />
</svg>
