<svg role="img" [attr.aria-label]="label" [attr.viewBox]="'0 0 ' + width + ' ' + height" [attr.width]="width" [attr.height]="height">
  <g *ngFor="let t of tiles" class="tile" tabindex="0" role="button" [attr.aria-label]="t.item.label + ' ' + pct(t.item.colorValue)"
     (click)="select.emit(t.item.id ?? t.item.label)" (keydown.enter)="select.emit(t.item.id ?? t.item.label)">
    <title>{{ t.item.label }} · {{ num(t.item.size) }} · {{ pct(t.item.colorValue) }}</title>
    <rect [attr.x]="t.x + 1" [attr.y]="t.y + 1" [attr.width]="max0(t.w - 2)" [attr.height]="max0(t.h - 2)" rx="3" [attr.fill]="fill(t.item.colorValue)" />
    <ng-container *ngIf="t.w > 64 && t.h > 36">
      <text [attr.x]="t.x + 9" [attr.y]="t.y + 20" class="n">{{ t.item.label }}</text>
      <text [attr.x]="t.x + 9" [attr.y]="t.y + 34" class="p">{{ pct(t.item.colorValue) }}</text>
    </ng-container>
  </g>
</svg>
