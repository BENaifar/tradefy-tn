<header class="navbar-wrapper" [class.scrolled]="isScrolled">
  <div class="container navbar-content">
    <!-- Brand / Logo -->
    <a routerLink="/" class="brand">
      <div class="brand-glyph">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="22 7 13.5 15.5 8.5 10.5 2 17"></polyline>
          <polyline points="16 7 22 7 22 13"></polyline>
        </svg>
      </div>
      <span class="brand-text">TRADE<span class="brand-dim">X</span></span>
      <span class="terminal-badge">PRO</span>
    </a>

    <!-- Nav Links (Landing sections) -->
    <nav id="primary-navigation" class="nav-links" [class.open]="mobileMenuOpen" aria-label="Main navigation">
      <a href="/#hero" (click)="$event.preventDefault(); scrollTo('#hero')" class="nav-link">Overview</a>
      <a href="/#ticker" (click)="$event.preventDefault(); scrollTo('#ticker')" class="nav-link">Markets</a>
      <a href="/#ai-system" (click)="$event.preventDefault(); scrollTo('#ai-system')" class="nav-link">Intelligence</a>
      <a href="/#features" (click)="$event.preventDefault(); scrollTo('#features')" class="nav-link">Platform</a>
    </nav>

    <!-- Auth Actions -->
    <div class="nav-actions">
      <ng-container *ngIf="authService.currentUser$ | async as user; else guestTpl">
        <a routerLink="/dashboard" class="user-pill">
          <span class="status-dot"></span>
          <span class="user-name">{{ user.firstName }}</span>
          <span class="role-tag">{{ user.role === 'ROLE_ADMIN' ? 'ADMIN' : 'USER' }}</span>
        </a>
        <button (click)="logout()" class="btn btn-ghost btn-sm" title="Sign Out">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
        </button>
      </ng-container>

      <ng-template #guestTpl>
        <a routerLink="/login" class="nav-link signin-link">Sign In</a>
        <a routerLink="/register" class="btn btn-primary btn-sm">Get Started</a>
      </ng-template>

      <!-- Mobile Hamburger -->
      <button class="hamburger-btn" (click)="mobileMenuOpen = !mobileMenuOpen" aria-label="Toggle navigation" aria-controls="primary-navigation" [attr.aria-expanded]="mobileMenuOpen">
        <span [class.active]="mobileMenuOpen"></span>
        <span [class.active]="mobileMenuOpen"></span>
      </button>
    </div>
  </div>
</header>
