# Local sandbox profile: start with   .\mvnw.cmd spring-boot:run -Dspring-boot.run.profiles=local
# Private H2 file database (no shared Neon data touched) + simulated prices around the clock,
# so charts get intraday candles without waiting for BVMT market hours.
spring.datasource.url=jdbc:h2:file:./data/pim-local;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

app.marketdata.provider=simulated
app.marketdata.ignore-market-hours=true
app.marketdata.poll-interval=PT10S
